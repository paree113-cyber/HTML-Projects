<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giphy Party</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Giphy Party 🎉</h1>
    <p>Search for a GIF, keep adding more, or clear them all.</p>
  </header>

  <main>
    <form id="search-form">
      <input id="search-input" type="text" placeholder="Search for a GIF..." autocomplete="off" required />
      <button type="submit" id="search-btn">Search</button>
      <button type="button" id="remove-btn">Remove All</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="spinner" class="spinner hidden" aria-hidden="true"></div>

    <section id="gifs" class="gifs" aria-label="Search results"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
