<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Buttons</title>
</head>
<body>
    <h1>Buttons Demo</h1>
    <form>
        <input
        name="city"
        type="text"
        placeholder="Enter your city"
        minlength="2"
        maxlength="10" 
        required>
    </form>
    <button>Our <b>First</b> Button!</button>
    <h2>Register</h2>
    <form>
        <button type="button">Click Me</button>
        <input type="email" placeholder="Email" name="email">
        <input type="password" name="password" placeholder="Password">
        <input type="checkbox" name="tos-agree"> I agree to the Terms of Service">
        <p>Select Shirt Size</p>
        <input type="radio" name="shirt-size" value="XS"> XS <br>
        <input type="radio" name="shirt-size" value="S"> S <br>
        <input type="radio" name="shirt-size" value="M"> M <br>
        <input type="radio" name="shirt-size" value="L"> L <br>

        <button type="submit">Submit Form</button>
        <!-- <input type="submit" value="GO!"> -->
    </form>

    <h2>Other Input Types</h2>
    <form>
        Pick a Color: <input type="color" name="color">
        Enter Your Birthday: <input type="date" name="birthday">
        How Happy Are You? <input type="range" name="happiness" min="1" max="10" step="2">
        <button type="submit">Submit Form</button>
    </form>

</body>
</html>
